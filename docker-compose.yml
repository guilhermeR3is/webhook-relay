services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # 5433 no host porque o 5432 costuma estar ocupado por um Postgres instalado na máquina
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      # dentro da rede do compose o banco é "postgres:5432"; sobrescreve o valor do .env
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      GIT_COMMIT: ${GIT_COMMIT:-dev}
      METRICS_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      GIT_COMMIT: ${GIT_COMMIT:-dev}
      METRICS_ENABLED: "true"
    # um envio em andamento pode levar 10 s; com o prazo padrão do Docker (10 s) o SIGKILL cortaria o desligamento limpo
    stop_grace_period: 20s
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      target: web
    environment:
      # o painel consulta a API pela rede do compose, pelo nome do serviço
      API_URL: http://api:3000
      PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    environment:
      # só local: quem abre o endereço vê os gráficos sem login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      # 3200 no host porque a API usa a 3000
      - "127.0.0.1:3200:3000"
    depends_on:
      - prometheus

  receiver:
    image: node:24-alpine
    profiles: [load]
    # o repositório inteiro, porque o node_modules do pnpm é feito de links relativos
    working_dir: /app/load
    volumes:
      - .:/app:ro
    command: ["node", "src/receiver-main.ts"]
    environment:
      RECEIVER_DELAY_MS: ${RECEIVER_DELAY_MS:-0}
    ports:
      - "127.0.0.1:4000:4000"

  k6:
    image: grafana/k6:1.8.0
    profiles: [k6]
    command: ["run", "--summary-export=/results/summary.json", "/scripts/ingest.js"]
    environment:
      TARGET_URL: http://api:3000
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-2m}
    volumes:
      - ./load/k6:/scripts:ro
      - ./load/results:/results

volumes:
  postgres-data:
