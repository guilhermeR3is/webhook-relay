services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # 5433 no host porque o 5432 costuma estar ocupado por um Postgres instalado na máquina
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      # dentro da rede do compose o banco é "postgres:5432"; sobrescreve o valor do .env
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      target: web
    environment:
      # o painel consulta a API pela rede do compose, pelo nome do serviço
      API_URL: http://api:3000
      PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
